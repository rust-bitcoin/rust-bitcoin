---   # rust-bitcoin CI: If you edit this file please update README.md
on:   # yamllint disable-line rule:truthy
  push:
    branches:
      - master
  pull_request:

name: Continuous integration

permissions: {}

jobs:
  Test:
    name: Test - ${{ matrix.toolchain }} toolchain, ${{ matrix.dep }} deps
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, msrv]
        dep: [minimal, recent]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rbmt
      - name: "Read compiler version"
        id: rustc
        run: |
          version=$(cargo rbmt toolchains --${{ matrix.toolchain }})
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: "Restore dependency artifacts"
        id: deps-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target
            ~/.cargo/registry
          key: test-deps-${{ runner.os }}-rustc-${{ steps.rustc.outputs.version }}-${{ matrix.dep }}-${{ hashFiles(format('Cargo-{0}.lock', matrix.dep)) }}
      - name: "Run tests"
        run: cargo rbmt test --toolchain ${{ matrix.toolchain }} --lock-file ${{ matrix.dep }}
      - name: "Prune workspace artifacts"
        id: prune
        if: github.event_name == 'push' && steps.deps-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          target=$(cargo metadata --format-version 1 --no-deps | jq -r .target_directory)
          for profile in "$target"/*/ "$target"/*/*/; do
            [ -d "$profile.fingerprint" ] || continue
            for dep_info in "$profile"deps/*.d; do
              grep -qs '^[^/#]' "$dep_info" || continue
              hash=${dep_info%.d}
              hash=${hash##*-}
              rm -rf "$profile".fingerprint/*-"$hash" "$profile"deps/*-"$hash" "$profile"deps/*-"$hash".*
            done
            find "$profile" -maxdepth 1 -type f ! -name .cargo-lock -delete
            rm -rf "$profile"examples "$profile"incremental
          done
          du -sh "$target" ~/.cargo/registry
      - name: "Save dependency artifacts"
        if: github.event_name == 'push' && steps.deps-cache.outputs.cache-hit != 'true' && steps.prune.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target
            ~/.cargo/registry
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

  Check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        task: [lint, docs]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rbmt
      - name: "Run ${{ matrix.task }}"
        run: cargo rbmt ${{ matrix.task }}

  Generate-API:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # History required for API diff.
      - uses: ./.github/actions/setup-rbmt
      - name: "Run API check"
        id: api_check
        run: |
          set +e
          cargo rbmt api --baseline ${{ github.event.pull_request.base.sha || github.event.before }}
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
      - name: "Save API diff state"
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXIT_CODE: ${{ steps.api_check.outputs.exit_code }}
        run: |
          echo "$PR_NUMBER" > api-diff
          echo "$EXIT_CODE" >> api-diff
      - name: "Upload API diff state"
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-diff
          path: api-diff

  Bench:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rbmt
      - name: "Check criterion benches"
        working-directory: benches
        run: cargo rbmt run --toolchain stable --lockfile existing -- bench -- --test

  Prerelease:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # History required for version bump detection.
      - uses: ./.github/actions/setup-rbmt
      - name: "Run pre-release checks"
        run: cargo rbmt prerelease --baseline ${{ github.event.pull_request.base.sha || github.event.before }}

  Embedded:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rbmt
      - name: "Set up QEMU"
        run: sudo apt-get update && sudo apt-get install -y qemu-system-arm
      - name: "Run bitcoin/embedded"
        working-directory: bitcoin/embedded
        run: source ./scripts/env.sh && cargo rbmt run --toolchain nightly --lockfile existing -- run --target thumbv7m-none-eabi
      - name: "Run hashes/embedded no alloc"
        working-directory: hashes/embedded
        run: source ./scripts/env.sh && cargo rbmt run --toolchain nightly --lockfile existing -- run --target thumbv7m-none-eabi
      - name: "Run hashes/embedded with alloc and no hex"
        working-directory: hashes/embedded
        run: source ./scripts/env.sh && cargo rbmt run --toolchain nightly --lockfile existing -- run --target thumbv7m-none-eabi --features=alloc
      - name: "Run hashes/embedded with alloc and hex"
        working-directory: hashes/embedded
        run: source ./scripts/env.sh && cargo rbmt run --toolchain nightly --lockfile existing -- run --target thumbv7m-none-eabi --features=alloc,hex

  Cross:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - s390x-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rbmt
      - name: "Install cross"
        run: cargo install cross --locked --git https://github.com/cross-rs/cross --rev 64b5bb4d3d34de062552b9a2093affe77b4ad16a
      - name: "Run cross test"
        run: |
          cp Cargo-recent.lock Cargo.lock
          cross test --target ${{ matrix.target }} --locked

  # Non cargo-rbmt jobs manage their toolchain version directly.
  Prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      nightly_version: ${{ steps.read_toolchain.outputs.nightly_version }}
    steps:
      - name: "Checkout repo"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Read workspace versions"
        id: read_toolchain
        # Defining bash shell forces github actions pipefail behavior
        shell: bash
        run: |
          nightly_version=$(cargo metadata --format-version 1 | jq -er '.metadata.rbmt.toolchains.nightly')
          # To force pipefail on error, assign must be separate
          echo "nightly_version=$nightly_version" >> "$GITHUB_OUTPUT"

  Arch32bit:
    name: Test 32-bit version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: "Checkout repo"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Select toolchain"
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: "Add architecture i386 and install dependencies"
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -y
          sudo apt-get install -y \
            gcc-multilib \
            g++-multilib \
            libc6-dev-i386 \
            lib32stdc++-13-dev
      - name: "Install i686 gcc"
        run: sudo apt-get update -y && sudo apt-get install -y gcc-multilib
      - name: "Install target"
        run: rustup target add i686-unknown-linux-gnu
      - name: "Run test on i686"
        run: cargo test --target i686-unknown-linux-gnu

  ASAN:                         # hashes crate only.
    name: ASAN - nightly toolchain
    needs: Prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        dep: [recent]
    steps:
      - name: "Checkout repo"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Select toolchain"
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ needs.Prepare.outputs.nightly_version }}
      - name: "Install rust-src"
        run: rustup component add rust-src
      - name: "Set dependencies"
        run: cp Cargo-${{ matrix.dep }}.lock Cargo.lock
      - name: "Run sanitizer script"
        run: cd ./hashes && ./contrib/sanitizer.sh

  Kani:
    name: Kani codegen - stable toolchain
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: "Checkout repo"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Build Kani proofs"
        uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        with:
          args: "--only-codegen"

  Policy:
    name: Enforce repo policy - stable toolchain
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
    steps:
      - name: "Checkout repo"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Select toolchain"
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: "Run policy script"
        run: ./contrib/check-for-policy-violations.sh

  Re-exports:
    name: Check re-exports - stable toolchain
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
    steps:
      - name: "Checkout repo"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Provides the cargo-rbmt binary scripts expect.
      - uses: ./.github/actions/setup-rbmt
      - name: "Run primitives API checker script"
        run: |
          contrib/generate-primitives-re-export-test.sh && (cd ./primitives && cargo test --all-features)
          contrib/generate-bitcoin-re-export-test.sh && (cd ./bitcoin && cargo test --all-features)
      - name: "Check error type re-exports"
        run: contrib/check-error-reexports.sh

  Encodable-coverage:
    name: Check Encode fuzz coverage - stable toolchain
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: "Checkout repo"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Select toolchain"
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: "Check Encode coverage"
        run: ./contrib/check-encodable-coverage.sh

  DiffMutants:
    name: Check cargo mutants in diff - stable toolchain
    runs-on: ubuntu-24.04
    steps:
      - name: "Checkout repo"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # required for full diff context
      - name: "Select toolchain"
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: "Fetch base branch for diff"
        run: git fetch origin master
      - name: "Retrieve relative diff"
        run: git diff origin/master.. -- '*.rs' | tee git.diff
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: cargo-mutants
      - run: cargo mutants --no-shuffle --in-diff git.diff

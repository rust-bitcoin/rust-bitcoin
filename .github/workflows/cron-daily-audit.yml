name: Audit
on: # yamllint disable-line rule:truthy
  schedule:
    - cron: "00 11 * * *" # 4am PDT
  workflow_dispatch:

permissions: {}

jobs:
  Audit:
    name: Audit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: "Checkout repo"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Install Rustup"
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: "Install cargo-binstall"
        uses: cargo-bins/cargo-binstall@75b4bfae1b2c753a6806bbce6e6cb89b602de33c # v1.22.0
      - name: "Binstall cargo-audit"
        run: cargo binstall cargo-audit --no-confirm
      - name: "Audit every lockfile"
        # Audit every lockfile and propagate failure
        run: |
          status=0
          for lockfile in $(git ls-files -- '*.lock'); do
            echo "::group::${lockfile}"
            cargo audit --deny warnings --file "${lockfile}" || status=1
            echo "::endgroup::"
          done
          exit "${status}"

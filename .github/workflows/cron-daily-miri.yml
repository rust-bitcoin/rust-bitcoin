name: Miri
on:   # yamllint disable-line rule:truthy
  schedule:
    # 10am every day UTC, this correlates to:
    # - 3am PDT
    # - 11am CET
    # - 9pm AEDT
    - cron: '00 10 * * *'

permissions: {}

jobs:
  Miri:
    name: Miri
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
    steps:
      - name: "Checkout repo"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Read nightly version"
        id: read_toolchain
        run: echo "nightly_version=$(cargo metadata --format-version 1 | jq -r '.metadata.rbmt.toolchains.nightly')" >> $GITHUB_OUTPUT
      - name: "Select toolchain"
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ steps.read_toolchain.outputs.nightly_version }}
          components: miri
      - name: "Setup miri"
        run: cargo miri setup
      - name: "Set dependencies"
        run: cp Cargo-recent.lock Cargo.lock
      - name: "Run test script"
        run: ./contrib/test-miri.sh

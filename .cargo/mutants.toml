additional_cargo_args = ["--all-features"]
examine_globs = ["consensus_encoding/src/**/*.rs", "units/src/**/*.rs", "primitives/src/**/*.rs"]
exclude_globs = [
    "units/src/amount/verification.rs" # kani tests
]
exclude_re = [
    "impl Arbitrary",
    "impl Debug",
    "impl fmt::Debug",
    "Error>::", # Trait impls of error types
    "Error<.*>>::", # Trait impls of generic error types
    "Error::", # Methods of error types
    "deserialize", # Skip serde mutation tests
    "serde_details::<impl de::Visitor<'_>", # Skip serde mutation tests
    "Iterator", # Mutating operations in an iterator can result in an infinite loop
    "Decode::decoder", # Mutant replacing Self::Decoder::default() with Default::default() is equivalent
    "<impl .*Decode for .*>::decoder", # Mutant replacing Default::default() is equivalent to returning new()
    "<impl .*Decoder for .*>::read_limit", # Function is for optimization and does not need to be tested.


    # ----------------------------------Crate-specific exclusions----------------------------------
    # units
    # src/amount/mod.rs
    "units/.* delete match arm Ok\\(0\\) in parse_signed_to_satoshi", # Unreachable, the input always has a dot here so it never parses as 0
    "units/.* replace - with \\+ in parse_signed_to_satoshi", # last_n is 0 for Satoshi, the only denomination that gets here
    "units/.* max_decimals <= 0 with false in parse_signed_to_satoshi", # Unreachable, a Satoshi amount is cut at the dot before the loop
    "units/.* decimals\\.is_none\\(\\) with true in parse_signed_to_satoshi", # Always true, the first arm returns when decimals is set
    "units/.* replace > with < in fmt_satoshi_in", # Unreachable, needs a denomination bigger than BTC and none exists
    "units/.* replace > with == in fmt_satoshi_in", # Unreachable, needs a denomination bigger than BTC and none exists
    "units/.* replace > with >= in fmt_satoshi_in", # Unreachable, needs a denomination bigger than BTC and none exists
    "units/.* replace \\+ with - in fmt_satoshi_in", # The exponent added is zero unless a denomination is bigger than BTC
    "units/.* replace < with <= in fmt_satoshi_in", # With num_width == width the padding is zero either way
    "units/.* replace /= with %= in dec_width", # Replacing /= with %= causes an infinite loop
    "units/.* replace == with != in dec_width", # Replacing == with != causes an infinite loop
    # src/locktime/relative.rs
    "units/.* replace \\| with \\^ in LockTime::to_consensus_u32", # Mutant from replacing | with ^, this returns the same value since the XOR is taken against the u16 with an all-zero bitmask
    "units/.* replace \\| with \\^ in Sequence::from_512_second_intervals", # Mutant from replacing | with ^, this returns the same value since the XOR is taken against the u16 with an all-zero bitmask
    "units/.* \\| with \\^ in Target::to_compact_lossy", # compact | (size << 24). compact and size are bitwise independent, so impossible to tell ^ from |.
    "units/.* error::is_target_negative", # Related to formatting/display
    "units/.* replace -= with /= in .*into_bounded_input", # /= leaves the decrement at the same value, causing an infinite loop

    # primitives
    "primitives/.* Opcode::classify", # Not possible to kill all mutants without individually checking every opcode classification
    "primitives/.* Block<Checked>::cached_witness_root", # Skip getters
    "primitives/.* Block<Checked>::transactions", # Skip getters
    "primitives/.* <impl PushBytesErrorReport for core::convert::Infallible>::input_len", # Uninhabited type, cannot be called
    "primitives/.* Script::to_bytes", # Deprecated
    "primitives/.* decode_cursor", # Mutating operations in decode_cursor can result in an infinite loop
    "primitives/.* fmt_debug", # Mutants from formatting/display changes
    "primitives/.* fmt_debug_pretty", # Mutants from formatting/display changes
    "primitives/.* Script::to_hex", # Deprecated
    "primitives/.* Script<T>::to_hex", # Deprecated
    "primitives/.* ScriptBuf::to_hex", # Deprecated
    "primitives/.* ScriptBuf<T>::to_hex", # Deprecated
    "primitives/.* <impl Encoder for .*Encoder<'_>>::current_chunk", # Replacing the return with Some(vec![]) causes an infinite loop.
    "primitives/.* <impl Encoder for .*Encoder<'_>>::advance", # Replacing the return with true causes an infinite loop.
    "primitives/.* <impl Decoder for WitnessDecoder>::push_bytes", # Replacing == with != causes an infinite loop
    "primitives/.* WitnessDecoder::resize_if_needed", # Replacing *= with += still resizes the buffer making the mutant untestable.
    "primitives/.* WitnessDecoder::reserve_batch", # Mutations cause an infinite loop
    "primitives/.* <impl encoding::Encoder for WitnessesEncoder<'_>>::advance -> bool", # Replacing with `true` cause an infinite loop
    "primitives/.* <impl encoding::Encoder for WitnessEncoder<'_>>::advance -> bool", # Replacing with `true` cause an infinite loop
    "primitives/.* == with != in <impl encoding::Decoder for WitnessDecoder>::push_bytes", # Replacing == with != causes an infinite loop
    "primitives/.* replace \\+ with \\* in MerkleNode::calculate_root", # Replacing + with * causes an infinite loop
    "primitives/.* replace == with != in MerkleNode::calculate_root", # Replacing == with != isn't caught unless alloc is disabled.
    "primitives/.* replace \\* with \\+ in <impl encoding::Decoder for WitnessDecoder>::end", # reserve(witness_elements * 4) only reserves capacity
    "primitives/.* replace \\* with / in <impl encoding::Decoder for WitnessDecoder>::end", # reserve(witness_elements * 4) only reserves capacity
    "primitives/.* replace && with \\|\\| in <impl encoding::Decoder for WitnessDecoder>::push_bytes", # reserve_exact only reserves capacity
    "primitives/.* replace \\+ with \\* in <impl encoding::Decoder for WitnessDecoder>::push_bytes", # reserve_exact only reserves capacity
    "primitives/.* replace \\* with \\+ in <impl encoding::Decoder for WitnessDecoder>::push_bytes", # reserve_exact only reserves capacity
    "primitives/.* replace \\* with / in <impl encoding::Decoder for WitnessDecoder>::push_bytes", # reserve_exact only reserves capacity
    # TODO: remove after x86 SIMD support lands (https://github.com/rust-bitcoin/rust-bitcoin/issues/5540)
    "primitives/.* calculate_root_batched", # Behind cfg(target_arch = "aarch64"), not compiled on x86_64 CI runner
    "primitives/.* <impl MerkleNode for TxMerkleNode>::calculate_root", # Behind cfg(target_arch = "aarch64"), not compiled on x86_64 CI runner
    "primitives/.* <impl MerkleNode for WitnessMerkleNode>::calculate_root", # Behind cfg(target_arch = "aarch64"), not compiled on x86_64 CI runner
    "primitives/.* replace \\% with \\+ in ScriptBuf<T>::push_slice_no_opt", # as u8 truncation makes >= 0x100 impossible to test
    "primitives/.* replace \\|\\| with && in Script<T>::witness_version", # && is impossible, and every byte is rejected by the length checks

    # consensus_encoding - most of these are for mutations in the logic used to determine when to stop encoding or decoding.
    "consensus_encoding/.* <impl Decoder for ArrayDecoder<N>>::push_bytes", # Mutations cause an infinite loop
    "consensus_encoding/.* <impl Decoder for .*>::end", # Mutations cause an infinite loop
    "consensus_encoding/.* encode_to_vec", # Mutations cause an infinite loop
    "consensus_encoding/.* encode_to_writer", # Mutations cause an infinite loop
    "consensus_encoding/.* decode_from_slice", # Mutations cause an infinite loop
    "consensus_encoding/.* decode_from_read", # Mutations cause an infinite loop
    "consensus_encoding/.* <impl Decoder for .*>::push_bytes", # Mutations cause an infinite loop
    "consensus_encoding/.* <impl Encoder for .*>::advance", # Replacing the return with true causes an infinite loop.
    "consensus_encoding/.* EncoderStatus::has_more", # Replacing with true causes an infinite loop
    "consensus_encoding/.* DecoderStatus::is_ready", # Replacing with true causes an infinite loop
    "consensus_encoding/.* delete ! in drain_to_vec", # Causes an infinite loop.
    "consensus_encoding/.* delete ! in drain_to_writer", # Causes an infinite loop.
    "consensus_encoding/.* ExactSizeEncoder::is_empty", # Too trivial to test.
]
